[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-jobs-core"
version = "0.1.0"
description = "Shared logic for the ats-jobs Apify Actors: adapters, normalization, billing, history."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "apify>=4.0,<5",
    "httpx>=0.27,<1",
    "defusedxml>=0.7",
]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
core = ["data/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "storage", "apify_storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The live contract tests are opt-in: a bare `pytest` is offline and fast, and
# `pytest -m live` still selects them because the later -m wins.
addopts = "-m 'not live'"
markers = [
    "live: hits real public ATS endpoints; opt in with -m live, excluded in CI with -m 'not live'",
]
